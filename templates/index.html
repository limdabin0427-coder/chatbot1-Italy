<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome to my Country!</title>

    <script>
    const CONFIG = {
        characterName : "Luca",
        country       : "Italy",
        gif: {
            greeting : "greeting.gif",
            speaking : "speaking.gif",
            yes      : "yes.gif",
            no       : "no.gif",
        },
        introBackground: "italy background 1.gif",
        introBackgrounds: ["italy background 1.gif", "italy background 2.gif"],
        backgrounds: [],
        flagImg    : "italy flag.gif",
        tts: { gender: "male", childMode: true, rate: 0.85 },
        landingTitle: "Welcome to my Country!",
        finaleMsg  : "내 나라에 놀러 와 줘서 고마워, 친구야!\nBye-bye, my friend!",
        homeUrl    : "",
        introTtsText: "",
        introTtsToken: "",
    };
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* ════════════════════════════════════
           전체 앱: 100vh, flex column
        ════════════════════════════════════ */
        #app {
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ── 배경 (전체 화면 고정) ── */
        #bg {
            position: fixed; inset: 0;
            z-index: 0; pointer-events: none;
            background:
                linear-gradient(rgba(255,255,255,0.15), rgba(255,255,255,0.15)),
                linear-gradient(160deg, #b8e4ff 0%, #fff4ca 55%, #b7e3c0 100%);
        }
        .bg-slide {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        /* ════════════════════════════════════
           상단 50% — 캐릭터 존
        ════════════════════════════════════ */
        #top {
            position: relative;
            flex: 0 0 50%;        /* ← 정확히 50% */
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 말풍선은 위쪽, 캐릭터는 아래쪽에 붙게 */
            justify-content: space-between;
            padding: 14px 14px 0;
            overflow: hidden;     /* 캐릭터가 밖으로 나가지 않게 */
        }

        /* 국기 */
        #flag {
            position: absolute;
            top: 14px; left: 14px;
            width: clamp(34px, 8vw, 50px); height: auto;
            border-radius: 4px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            z-index: 20;
        }
        #home-btn {
            position:fixed; top:14px; right:14px; z-index:10000;
            width:48px; height:48px; border:none; border-radius:50%;
            background:rgba(255,255,255,0.94); box-shadow:0 3px 12px rgba(0,0,0,0.25);
            font-size:25px; cursor:pointer;
        }

        /* 말풍선 */
        #bubble {
            position: relative;
            z-index: 8;
            background: rgba(255,255,255,0.97);
            border-radius: 20px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.18);
            padding: 12px 20px;
            width: min(70vw, 300px);
            text-align: center;
            font-size: clamp(13px, 3.6vw, 18px);
            font-weight: 700;
            color: #1a1a2e;
            line-height: 1.5;
            word-break: keep-all;
            display: none;        /* startApp()에서 보임 */
            /* 말풍선 꼬리 */
            margin-bottom: 0;
        }
        #bubble::after {
            content: '';
            position: absolute;
            bottom: -10px; left: 50%;
            transform: translateX(-50%);
            border: 10px solid transparent;
            border-top-color: rgba(255,255,255,0.97);
            border-bottom: 0;
        }

        /* 캐릭터 GIF ─ 상단 50% 안에서 남은 공간을 채움 */
        #char {
            position: relative;
            z-index: 10;
            flex: 1 1 0;          /* 말풍선 제외 남은 높이 전부 */
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
        }
        #char img {
            height: 100%;         /* 상단 50% 내 남은 높이를 꽉 채움 */
            width: auto;
            max-width: 100%;
            object-fit: contain;
            object-position: bottom center;
            mix-blend-mode: screen; /* 검정 배경 투명화 */
        }

        /* ════════════════════════════════════
           하단 50% — 글래스모피즘 대화 존
        ════════════════════════════════════ */
        #bottom {
            position: relative;
            flex: 0 0 50%;        /* ← 정확히 50% */
            z-index: 15;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.22);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            border-top: 1px solid rgba(255,255,255,0.4);
            overflow: hidden;
        }

        /* 채팅 스크롤 영역 */
        #chat {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 14px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.3) transparent;
        }
        #chat::-webkit-scrollbar { width: 3px; }
        #chat::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.35);
            border-radius: 3px;
        }

        /* 메시지 행 */
        .row { display: flex; align-items: flex-start; gap: 6px; }
        .row.luca-row { align-self: flex-start; max-width: 88%; }
        .row.user-row { align-self: flex-end; max-width: 88%; }

        .msg-flag {
            width: clamp(18px, 4.5vw, 24px); height: auto;
            border-radius: 3px; flex-shrink: 0; margin-top: 2px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .msg {
            padding: 8px 12px; border-radius: 14px;
            font-size: clamp(12px, 3.3vw, 15px);
            font-weight: 600; line-height: 1.45; word-break: break-word;
        }
        .msg.luca {
            background: rgba(255,255,255,0.92); color: #1d1d1f;
            border-top-left-radius: 3px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.10);
        }
        .msg.user {
            background: rgba(0,176,155,0.85); color: #fff;
            border-top-right-radius: 3px;
        }

        /* ── 하단 컨트롤 (힌트 + 마이크) ── */
        #controls {
            flex: 0 0 auto;         /* 절대 축소 안 됨 */
            padding: 8px 16px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* 노란 힌트 캡슐 */
        #popup {
            width: 100%;
            background: #FFE44D;
            color: #4a3500;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: clamp(12px, 3.2vw, 14px);
            font-weight: 700;
            text-align: center;
            line-height: 1.4;
            box-shadow: 0 3px 10px rgba(200,160,0,0.25);
            white-space: pre-wrap;
            /* 숨김 애니메이션 */
            max-height: 0; overflow: hidden;
            opacity: 0; padding-top: 0; padding-bottom: 0;
            transition: max-height 0.32s ease, opacity 0.28s ease, padding 0.28s ease;
        }
        #popup.show {
            max-height: 80px; opacity: 1;
            padding: 10px 18px;
        }

        /* 서브 안내 */
        #hint {
            color: rgba(30,30,30,0.85);
            font-size: clamp(11px, 2.9vw, 13px);
            font-weight: 700;
            text-align: center;
        }

        /* 마이크 버튼 — 항상 보임, startApp 전엔 비활성 스타일 */
        #mic {
            width: clamp(56px, 13vw, 66px);
            height: clamp(56px, 13vw, 66px);
            border-radius: 50%; border: none;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
            font-size: clamp(22px, 5.5vw, 26px);
            cursor: pointer;
            box-shadow: 0 5px 18px rgba(255,65,108,0.48);
            transition: transform 0.15s, box-shadow 0.15s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            /* ✅ 처음부터 보이게, 단 비활성 상태 */
            display: block;
            opacity: 0.35;
            pointer-events: none;
        }
        /* startApp 후 활성화 */
        #mic.active {
            opacity: 1;
            pointer-events: auto;
        }
        #mic.active:active { transform: scale(0.93); }
        #mic.recording {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            box-shadow: 0 0 28px rgba(56,239,125,0.75);
            animation: pulse 1.4s infinite;
        }
        @keyframes pulse {
            0%{transform:scale(1)} 50%{transform:scale(1.09)} 100%{transform:scale(1)}
        }

        /* ── 피날레 ── */
        #finale { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.80); z-index:9998; justify-content:center; align-items:center; }
        #finale.show { display:flex; }
        #finale-card {
            background: linear-gradient(135deg,#fff9e6,#fff);
            color:#2a2a2a; padding:28px 24px; border-radius:22px;
            text-align:center; line-height:1.75;
            box-shadow:0 12px 40px rgba(0,0,0,0.4);
            max-width:min(310px,90vw); border:3px solid #FFD700;
        }
        #finale-msg {
            font-size:clamp(16px,4.5vw,20px); font-weight:800;
            white-space:pre-wrap;
        }
        #retry-btn {
            margin-top:18px; width:100%; padding:12px 16px;
            border:none; border-radius:12px; cursor:pointer;
            background:linear-gradient(135deg,#00b09b,#96c93d);
            color:#fff; font-size:clamp(14px,3.8vw,17px); font-weight:800;
            line-height:1.35;
        }
        #retry-btn:disabled { opacity:0.55; cursor:default; }
        .spark { position:fixed; border-radius:50%; pointer-events:none; z-index:9997; animation:sparkFly 1.3s ease-out forwards; }
        @keyframes sparkFly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--tx),var(--ty)) scale(0.1);opacity:0} }

        /* ── 로그인 ── */
        #login { position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:9999; display:flex; justify-content:center; align-items:center; }
        #login-box {
            background:#fff; padding:30px 24px; border-radius:20px;
            text-align:center; max-width:320px; width:90%;
            box-shadow:0 8px 32px rgba(0,0,0,0.35);
        }
        .lt { font-size:clamp(19px,5vw,24px); font-weight:800; color:#1a1a2e; margin-bottom:6px; }
        .ls { font-size:clamp(13px,3.3vw,14px); font-weight:600; color:#555; margin-bottom:2px; }
        .lk { font-size:clamp(11px,2.8vw,13px); color:#999; margin-bottom:16px; }
        .login-input {
            width:100%; padding:11px 14px; border:1.5px solid #ddd; border-radius:9px;
            font-size:16px; text-align:center; margin-bottom:12px; outline:none;
            transition:border-color 0.2s;
        }
        .login-input:focus { border-color:#00b09b; }
        #login-btn {
            width:100%; padding:12px; border:none; border-radius:9px;
            background:linear-gradient(135deg,#00b09b,#96c93d);
            color:#fff; font-size:clamp(14px,3.8vw,16px); font-weight:800; cursor:pointer;
        }
    </style>
</head>
<body>

<!-- 로그인 -->
<div id="login">
    <div id="login-box">
        <div class="lt" id="landing-title">✈️ Welcome to my Country!</div>
        <div class="ls">Enter your number and name.</div>
        <div class="lk">번호와 이름을 입력하세요</div>
        <input type="text" inputmode="numeric" class="login-input" id="number-input" placeholder="번호 (예: 01)">
        <input type="text" class="login-input" id="name-input" placeholder="이름 (예: 홍길동)">
        <button id="login-btn">Let's Go! 🚀</button>
    </div>
</div>

<!-- 피날레 -->
<div id="finale">
    <div id="finale-card">
        <div id="finale-msg"></div>
        <button id="retry-btn">🔁 Ask Again<br>다시 질문하기</button>
    </div>
</div>

<!-- 메인 -->
<div id="app">
    <div id="bg"></div>
    <button id="home-btn" title="홈으로 돌아가기" aria-label="홈으로 돌아가기">🏠</button>

    <!-- 상단 50% -->
    <div id="top">
        <img id="flag" alt="flag">

        <!-- 말풍선 -->
        <div id="bubble"></div>

        <!-- 캐릭터 -->
        <div id="char">
            <img id="char-img" alt="character">
        </div>
    </div>

    <!-- 하단 50% -->
    <div id="bottom">
        <div id="chat"></div>

        <div id="controls">
            <div id="popup"></div>
            <div id="hint">잠시만 기다려주세요...</div>
            <button id="mic">🎙️</button>
        </div>
    </div>
</div>

<script>
/* ── DOM 참조 ── */
const bubble    = document.getElementById('bubble');
const popup     = document.getElementById('popup');
const chat      = document.getElementById('chat');
const hint      = document.getElementById('hint');
const mic       = document.getElementById('mic');
let recognition = null;
let isBotSpeaking = false;
let isListening = false;
let recognitionActive = false;
let manualStopRequested = false;
let recognitionCandidates = [];
let isSubmittingSpeech = false;
let recognitionStarting = false;
let mediaRecorder = null;
let mediaStream = null;
let recordedChunks = [];
let recordingTimer = null;
// 일부 모바일 브라우저가 오디오 종료 이벤트를 누락해도 다음 차례가 잠기지 않도록
// 현재 발화와 복구 타이머를 한 쌍으로 관리한다.
let speechRunId = 0;
let speechSafetyTimer = null;
const finale    = document.getElementById('finale');
const retryBtn  = document.getElementById('retry-btn');
const homeBtn   = document.getElementById('home-btn');
const charImg   = document.getElementById('char-img');
const flagEl    = document.getElementById('flag');

let voices = [], studentNumber = '', studentName = '', stage = 'WAIT_GREETING';
let conversationHistory = [], popupTimer = null;
let backgroundTimer = null, backgroundIndex = 0, usingConversationBackgrounds = false;
const backgroundDuration = 8000;

/* ── CONFIG 초기화: config.py의 CHATBOT_ID → /api/config → 화면 ── */
let configReady = false;

function applyConfig() {
    const bg = document.getElementById('bg');
    bg.innerHTML = '';
    const introSources = CONFIG.introBackgrounds?.length
        ? CONFIG.introBackgrounds
        : [CONFIG.introBackground || CONFIG.backgrounds[0]].filter(Boolean);
    // 시작 배경을 모두 미리 불러오고 겹쳐서 부드럽게 전환한다.
    const introSlides = introSources.map((src, index) => {
        const d = document.createElement('div');
        d.className = 'bg-slide intro-bg';
        d.dataset.backgroundRole = 'intro';
        d.style.backgroundImage = `url('${src}')`;
        d.style.opacity = index === 0 ? '1' : '0';
        bg.appendChild(d);
        return d;
    });
    if (introSlides.length > 1) {
        let introIndex = 0;
        const rotateIntro = () => {
            if (usingConversationBackgrounds || !introSlides[0]?.isConnected) return;
            backgroundTimer = setTimeout(() => {
                introSlides[introIndex].style.opacity = '0';
                introIndex = (introIndex + 1) % introSources.length;
                introSlides[introIndex].style.opacity = '1';
                rotateIntro();
            }, backgroundDuration);
        };
        rotateIntro();
    }
    flagEl.src = CONFIG.flagImg;
    flagEl.alt = `${CONFIG.country} flag`;
    charImg.src = CONFIG.gif.greeting;
    charImg.alt = CONFIG.characterName;
    document.getElementById('finale-msg').innerText = CONFIG.finaleMsg;
    document.getElementById('landing-title').innerText = `✈️ ${CONFIG.landingTitle}`;
    document.title = `${CONFIG.characterName} - ${CONFIG.country}`;
}

function startBackgroundRotation() {
    clearTimeout(backgroundTimer);
    const slides = Array.from(document.querySelectorAll('.conversation-bg'));
    if (slides.length < 2) return;
    backgroundIndex = 0;

    const showNextBackground = () => {
        backgroundTimer = setTimeout(() => {
            slides[backgroundIndex].style.opacity = '0';
            backgroundIndex = (backgroundIndex + 1) % slides.length;
            slides[backgroundIndex].style.opacity = '1';
            showNextBackground();
        }, backgroundDuration);
    };

    showNextBackground();
}

async function startConversationBackgrounds() {
    if (usingConversationBackgrounds) return;
    clearTimeout(backgroundTimer);
    const bg = document.getElementById('bg');
    if (!CONFIG.backgrounds.length) return;

    const available = (await Promise.all(CONFIG.backgrounds.map(src => new Promise(resolve => {
        const image = new Image();
        image.onload = () => resolve(src);
        image.onerror = () => resolve(null);
        image.src = src;
    })))).filter(Boolean);
    if (!available.length) return;
    usingConversationBackgrounds = true;

    const introSlides = Array.from(bg.querySelectorAll('[data-background-role="intro"]'));
    const slides = available.map((src) => {
        const d = document.createElement('div');
        d.className = 'bg-slide conversation-bg';
        d.style.backgroundImage = `url('${src}')`;
        d.style.opacity = '0';
        bg.appendChild(d);
        return d;
    });

    void bg.offsetWidth;
    slides[0].style.opacity = '1';
    introSlides.forEach(slide => { slide.style.opacity = '0'; });

    setTimeout(() => {
        introSlides.forEach(slide => slide.remove());
        startBackgroundRotation();
    }, 1600);
}

async function loadChatbotConfig() {
    const loginBtn = document.getElementById('login-btn');
    loginBtn.disabled = true;
    hint.innerText = '챗봇 설정을 불러오는 중입니다...';

    try {
        const res = await fetch('/api/config', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        CONFIG.characterName = data.characterName;
        CONFIG.country = data.country;
        CONFIG.gif = data.gif;
        CONFIG.introBackground = data.introBackground;
        CONFIG.introBackgrounds = data.introBackgrounds || [];
        CONFIG.backgrounds = data.backgrounds;
        CONFIG.flagImg = data.flagImg;
        CONFIG.tts = data.tts;
        CONFIG.landingTitle = data.landingTitle;
        CONFIG.finaleMsg = data.finaleMsg;
        CONFIG.homeUrl = data.homeUrl || "";
        CONFIG.introTtsText = data.introTtsText || "";
        CONFIG.introTtsToken = data.introTtsToken || "";

        applyConfig();
        // 학생이 번호와 이름을 입력하는 동안 첫 OpenAI 음성을 미리 내려받는다.
        prepareIntroTts();
        configReady = true;
        hint.innerText = '번호와 이름을 입력해주세요.';
    } catch (error) {
        console.error('챗봇 설정 로딩 실패:', error);
        applyConfig();
        configReady = true;
        hint.innerText = '기본 설정으로 시작합니다.';
    } finally {
        loginBtn.disabled = false;
    }
}

loadChatbotConfig();

/* ── TTS ── */
function loadVoices() { voices = window.speechSynthesis.getVoices(); }
loadVoices();
if (window.speechSynthesis.onvoiceschanged !== undefined)
    window.speechSynthesis.onvoiceschanged = loadVoices;

function pickVoice(gender) {
    const male = gender !== 'female';
    const hi   = male
        ? ['google us english','google uk english male','microsoft guy','alex','daniel','tom']
        : ['google us english','google uk english female','microsoft zira','samantha','karen'];
    let v = voices.find(v => v.lang.startsWith('en') && hi.some(n => v.name.toLowerCase().includes(n)));
    if (v) return v;
    v = voices.find(v => v.lang.startsWith('en') && /natural|premium|enhanced|neural/i.test(v.name));
    if (v) return v;
    return voices.find(v => v.lang.startsWith('en')) || null;
}

// Safari/iOS에서 비동기 응답 뒤 새 Audio 재생이 막히지 않도록
// 하나의 플레이어를 사용자 터치로 미리 열고 대화 끝까지 재사용한다.
const ttsPlayer = new Audio();
ttsPlayer.preload = 'auto';
ttsPlayer.setAttribute('playsinline', '');
let activeAudio = null;
let activeAudioUrl = null;
let ttsAudioUnlocked = false;
const ttsAudioCache = new Map();
const ttsPendingCache = new Map();

function unlockTtsAudio() {
    if (ttsAudioUnlocked) return;
    // API를 사용하지 않는 아주 짧은 로컬 무음 WAV이다.
    const silentWav = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAAAAAACA';
    try {
        ttsPlayer.src = silentWav;
        ttsPlayer.load();
        const playPromise = ttsPlayer.play();
        if (playPromise && typeof playPromise.then === 'function') {
            playPromise.then(() => {
                ttsPlayer.pause();
                ttsPlayer.currentTime = 0;
                ttsAudioUnlocked = true;
            }).catch(() => {});
        } else {
            ttsAudioUnlocked = true;
        }
    } catch(e) {}
}
const ttsClientId = sessionStorage.getItem('ttsClientId') ||
    ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
sessionStorage.setItem('ttsClientId', ttsClientId);

let introTtsReadyPromise = null;

function prepareIntroTts() {
    if (CONFIG.tts.provider !== 'openai' || !CONFIG.introTtsText || !CONFIG.introTtsToken) {
        return null;
    }
    if (!introTtsReadyPromise) {
        introTtsReadyPromise = requestOpenAITts(CONFIG.introTtsText, CONFIG.introTtsToken)
            .catch(error => {
                // 실패한 요청을 고정하지 않아 시작 시 한 번 더 시도할 수 있게 한다.
                introTtsReadyPromise = null;
                console.warn('첫 인사 TTS 사전 준비 실패:', error);
                return null;
            });
    }
    return introTtsReadyPromise;
}

function requestOpenAITts(text, ttsToken) {
    if (!ttsToken) return Promise.reject(new Error('No TTS token'));
    if (ttsAudioCache.has(ttsToken)) return Promise.resolve(ttsAudioCache.get(ttsToken));
    if (ttsPendingCache.has(ttsToken)) return ttsPendingCache.get(ttsToken);

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);
    const requestPromise = fetch('/api/tts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text, token: ttsToken, client_id: ttsClientId}),
        signal: controller.signal,
    })
        .then(response => {
            if (!response.ok) throw new Error(`TTS HTTP ${response.status}`);
            return response.blob();
        })
        .then(blob => {
            ttsAudioCache.set(ttsToken, blob);
            return blob;
        })
        .finally(() => {
            clearTimeout(timeout);
            ttsPendingCache.delete(ttsToken);
        });

    ttsPendingCache.set(ttsToken, requestPromise);
    return requestPromise;
}

function speak(text, cb, displayText=null, ttsToken=null) {
    const runId = ++speechRunId;
    clearTimeout(speechSafetyTimer);
    speechSafetyTimer = null;
    // 챗봇 음성이 학생 답변으로 다시 인식되지 않도록 발화 중 마이크를 잠근다.
    isBotSpeaking = true;
    isListening = false;
    recognitionActive = false;
    manualStopRequested = false;
    recognitionCandidates = [];
    mic.classList.remove('active', 'recording');
    if (recognition) {
        try { recognition.abort(); } catch(e) {}
    }

    window.speechSynthesis.cancel();
    if (activeAudio) {
        activeAudio.pause();
        activeAudio = null;
    }
    if (activeAudioUrl) {
        URL.revokeObjectURL(activeAudioUrl);
        activeAudioUrl = null;
    }
    bubble.innerText = displayText || text;
    bubble.style.display = 'block';
    const clean = text.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}]/gu,'').replace(/\s{2,}/g,' ').trim();
    let finished = false;
    let fallbackStarted = false;
    const finishSpeaking = () => {
        if (finished || runId !== speechRunId) return;
        finished = true;
        clearTimeout(speechSafetyTimer);
        speechSafetyTimer = null;
        // 스피커 잔향까지 마이크가 잡지 않도록 아주 짧게 기다린 뒤 다시 활성화한다.
        setTimeout(() => {
            isBotSpeaking = false;
            if (String(stage).toLowerCase() !== 'end' && mic.style.display !== 'none') {
                mic.classList.add('active');
            }
            if (cb) cb();
        }, 150);
    };

    const skipUnavailableAudio = () => {
        if (fallbackStarted || finished || runId !== speechRunId) return;
        fallbackStarted = true;
        // 다른 브라우저 내장 목소리를 재생하지 않고 다음 차례를 안전하게 연다.
        finishSpeaking();
    };

    const playAudioBlob = (blob) => {
        const objectUrl = URL.createObjectURL(blob);
        const audio = ttsPlayer;
        if (activeAudioUrl) URL.revokeObjectURL(activeAudioUrl);
        activeAudioUrl = objectUrl;
        audio.src = objectUrl;
        audio.load();
        activeAudio = audio;
        let lastProgressAt = Date.now();
        let lastCurrentTime = 0;
        const cleanup = () => {
            if (activeAudio === audio) activeAudio = null;
            if (activeAudioUrl === objectUrl) {
                URL.revokeObjectURL(objectUrl);
                activeAudioUrl = null;
            }
            audio.onended = null;
            audio.onerror = null;
            audio.onabort = null;
            audio.onstalled = null;
            audio.ontimeupdate = null;
        };
        const watchPlayback = () => {
            if (finished || runId !== speechRunId || activeAudio !== audio) return;
            if (audio.currentTime > lastCurrentTime + 0.05) {
                lastCurrentTime = audio.currentTime;
                lastProgressAt = Date.now();
            }
            if (audio.ended || (audio.duration && audio.currentTime >= audio.duration - 0.1)) {
                cleanup(); finishSpeaking(); return;
            }
            if (Date.now() - lastProgressAt < 7000) {
                speechSafetyTimer = setTimeout(watchPlayback, 1000);
                return;
            }
            try { audio.pause(); } catch(e) {}
            cleanup();
            skipUnavailableAudio();
        };
        audio.ontimeupdate = () => {
            if (audio.currentTime > lastCurrentTime + 0.05) {
                lastCurrentTime = audio.currentTime;
                lastProgressAt = Date.now();
            }
        };
        audio.onended = () => { cleanup(); finishSpeaking(); };
        audio.onerror = () => { cleanup(); skipUnavailableAudio(); };
        audio.onabort = () => { cleanup(); skipUnavailableAudio(); };
        audio.onstalled = () => {
            clearTimeout(speechSafetyTimer);
            speechSafetyTimer = setTimeout(watchPlayback, 1000);
        };
        audio.play().then(() => {
            clearTimeout(speechSafetyTimer);
            speechSafetyTimer = setTimeout(watchPlayback, 1000);
        }).catch(() => { cleanup(); skipUnavailableAudio(); });
    };

    if (CONFIG.tts.provider !== 'openai' || !ttsToken) {
        skipUnavailableAudio();
        return;
    }

    if (ttsAudioCache.has(ttsToken)) {
        playAudioBlob(ttsAudioCache.get(ttsToken));
        return;
    }

    requestOpenAITts(text, ttsToken)
        .then(playAudioBlob)
        .catch(() => skipUnavailableAudio())
        ;
}

/* ── 폭죽 ── */
function burst(x, y, n, dist) {
    const cl = ['#FF4136','#FF851B','#FFDC00','#2ECC40','#0074D9','#B10DC9','#FF69B4','#fff'];
    for (let i = 0; i < n; i++) {
        const s = document.createElement('div'); s.classList.add('spark');
        const a = Math.random()*Math.PI*2, d = dist*0.4 + Math.random()*dist;
        s.style.cssText = `left:${x}px;top:${y}px;width:${5+Math.random()*9}px;height:${5+Math.random()*9}px;background:${cl[Math.floor(Math.random()*cl.length)]};--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;animation-delay:${Math.random()*0.4}s;animation-duration:${0.9+Math.random()*0.5}s;`;
        document.body.appendChild(s); setTimeout(()=>s.remove(),2000);
    }
}
function fireworks() {
    const cx = innerWidth/2, cy = innerHeight/2;
    burst(cx,cy,130,280);
    [[cx*.35,cy*.55],[cx*1.65,cy*.5],[cx,cy*1.35]].forEach(([x,y],i)=>setTimeout(()=>burst(x,y,60,160),(i+1)*400));
}

}

/* ── API 호출 ── */
async function talk(input, alternatives=[]) {
    scheduleHide(400);
    try {
        const res  = await fetch('/api/chat', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                message: input,
                alternatives,
                history: conversationHistory,
                stage,
            })
        });
        const data = await res.json();
        if (data.suppress_user_message) {
            isListening = false; recognitionActive = false; recognitionStarting = false;
            manualStopRequested = false; recognitionCandidates = []; isSubmittingSpeech = false;
            mic.classList.remove('recording');
            if (!isBotSpeaking && String(stage).toLowerCase() !== 'end' && mic.style.display !== 'none') mic.classList.add('active');
            hint.innerText = data.retry_message || '잘 듣지 못했어요. 버튼을 누르고 다시 말해 보세요!';
            return;
        }
        if (!res.ok) throw new Error(`Chat HTTP ${res.status}`);
        const shownInput = data.recognized_text || input;
        addMsg('user', shownInput);
        conversationHistory.push({ role:'user', content:shownInput });
        const fullAssistantReply = [data.reply, data.followup_reply]
            .filter(Boolean)
            .join(' ');
        conversationHistory.push({ role:'assistant', content:fullAssistantReply });
        if (data.stage) stage = data.stage;
        if (stage === 'STUDENT_QUESTION_1') startConversationBackgrounds();
        setGif(data.reaction);
        addMsg('luca', data.reply);
        const pp = data.popup || null;
        // 첫 말풍선을 재생하는 동안 다음 말풍선의 음성을 미리 준비한다.
        if (data.followup_reply && data.followup_tts_token) {
            requestOpenAITts(data.followup_reply, data.followup_tts_token).catch(() => {});
        }
        const finishTurn = () => {
            if (data.fireworks) {
                hidePopup();
                hint.innerText = '수고했어요! 🎉';
                mic.style.display = 'none';
                showFinale();
            } else {
                hint.innerText = '🎙️ 버튼을 누르고 대답해보세요!';
                pp ? setTimeout(()=>showPopup(pp),200) : hidePopup();
            }
        };

        speak(data.speech_reply || data.reply, () => {
            if (data.followup_reply) {
                setGif('speaking');
                addMsg('luca', data.followup_reply);
                speak(data.followup_reply, finishTurn, null, data.followup_tts_token);
            } else {
                finishTurn();
            }
        }, null, data.tts_token);
    } catch(e) {
        addMsg('luca',"Sorry, I missed that. Can you say it again?");
        speak("Sorry, I missed that.");
    }
}

/* ── STT ── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isAppleMobile = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

if (SR || (isAppleMobile && navigator.mediaDevices && window.MediaRecorder)) {
    const isClearlyUnreliableTranscript = value => {
        const raw = String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
        const bare = raw.replace(/^[\[({\s]+|[\])}.!?\s]+$/g, '').trim();
        if (!bare || ['silence', 'silent', 'no speech', 'no audio', 'inaudible'].includes(bare)) return true;
        if (/(?:https?:\/\/|www\.)\S+/.test(raw) || /\b[a-z0-9-]+\.(?:com|org|net|edu|co\.kr)\b/.test(raw)) return true;
        const compact = raw.replace(/[^a-z0-9]+/g, ' ').trim();
        return ['learn english for free www engvid com', 'learn english for free engvid com'].includes(compact);
    };

    const resetRecognition = (message='🎙️ 버튼을 한 번 누르고 말해 보세요!') => {
        isListening = false;
        recognitionActive = false;
        recognitionStarting = false;
        manualStopRequested = false;
        recognitionCandidates = [];
        isSubmittingSpeech = false;
        mic.classList.remove('recording');
        if (!isBotSpeaking && String(stage).toLowerCase() !== 'end' && mic.style.display !== 'none') mic.classList.add('active');
        hint.innerText = message;
    };

    const submitRecognition = () => {
        if (!isListening || isSubmittingSpeech) return;
        isSubmittingSpeech = true;
        const candidates = [...new Set(
            recognitionCandidates.map(text => text.trim()).filter(text => text && !isClearlyUnreliableTranscript(text))
        )];
        if (candidates.length === 0) {
            resetRecognition('잘 듣지 못했어요. 버튼을 누르고 다시 말해 보세요!');
            return;
        }

        isListening = false;
        recognitionActive = false;
        manualStopRequested = false;
        mic.classList.remove('recording', 'active');
        hint.innerText = '대답을 확인하고 있어요...';
        talk(candidates[0], candidates.slice(1)).finally(() => {
            isSubmittingSpeech = false;
        });
    };

    const createRecognition = () => {
        // Safari에서는 종료된 SpeechRecognition 객체를 재사용하면 두 번째 발화부터
        // 빈 결과가 오는 경우가 있어 매 발화마다 새 객체를 만든다.
        const current = new SR();
        current.lang = 'en-US';
        current.interimResults = false;
        current.continuous = false;
        current.maxAlternatives = 5;

        current.onstart = () => {
            if (recognition !== current) return;
            recognitionStarting = false;
            recognitionActive = true;
            if (manualStopRequested) {
                try { current.stop(); } catch(e) { submitRecognition(); }
            }
        };

        current.onresult = e => {
            if (recognition !== current) return;
            for (let resultIndex = e.resultIndex; resultIndex < e.results.length; resultIndex++) {
                const result = e.results[resultIndex];
                for (let alternativeIndex = 0; alternativeIndex < result.length; alternativeIndex++) {
                    const transcript = result[alternativeIndex].transcript;
                    if (transcript) recognitionCandidates.push(transcript);
                }
            }
        };

        current.onend = () => {
            if (recognition !== current) return;
            recognition = null;
            recognitionActive = false;
            recognitionStarting = false;
            if (!isListening) return;
            if (manualStopRequested) {
                submitRecognition();
            } else {
                hint.innerText = '말을 마쳤으면 버튼을 다시 눌러주세요!';
            }
        };

        current.onerror = e => {
            if (recognition !== current) return;
            recognition = null;
            recognitionActive = false;
            recognitionStarting = false;
            if (e.error === 'aborted' && isBotSpeaking) return;
            if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                resetRecognition('목소리가 안 들려요. 크롬에서 마이크를 허용해 주세요!');
                return;
            }
            resetRecognition('잘 듣지 못했어요. 버튼을 누르고 다시 말해 보세요!');
        };

        return current;
    };

    const closeMediaStream = () => {
        clearTimeout(recordingTimer);
        recordingTimer = null;
        if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
        mediaRecorder = null;
    };

    const submitAppleRecording = async blob => {
        if (!blob || blob.size < 100) {
            resetRecognition('잘 듣지 못했어요. 버튼을 누르고 다시 말해 보세요!');
            return;
        }
        isListening = false;
        isSubmittingSpeech = true;
        mic.classList.remove('recording', 'active');
        hint.innerText = '대답을 확인하고 있어요...';
        try {
            const type = blob.type || 'audio/mp4';
            const extension = type.includes('webm') ? 'webm' : 'm4a';
            const form = new FormData();
            form.append('audio', blob, `speech.${extension}`);
            form.append('client_id', ttsClientId);
            const response = await fetch('/api/transcribe', {method:'POST', body:form});
            if (!response.ok) throw new Error(`STT HTTP ${response.status}`);
            const data = await response.json();
            if (!data.text || isClearlyUnreliableTranscript(data.text)) throw new Error('Empty transcript');
            await talk(data.text, []);
        } catch (error) {
            console.error('Apple 음성 변환 실패:', error);
            resetRecognition('잘 듣지 못했어요. 버튼을 누르고 다시 말해 보세요!');
        } finally {
            isSubmittingSpeech = false;
        }
    };

    const stopAppleRecording = () => {
        clearTimeout(recordingTimer);
        recordingTimer = null;
        if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
        hint.innerText = '대답을 확인하고 있어요...';
        try { mediaRecorder.stop(); } catch(e) { closeMediaStream(); resetRecognition(); }
    };

    const startAppleRecording = async () => {
        if (recognitionStarting || isSubmittingSpeech) return;
        recognitionStarting = true;
        recordedChunks = [];
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: {echoCancellation:true, noiseSuppression:true, autoGainControl:true}
            });
            const candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
            const mimeType = candidates.find(type => MediaRecorder.isTypeSupported(type));
            mediaRecorder = mimeType
                ? new MediaRecorder(mediaStream, {mimeType})
                : new MediaRecorder(mediaStream);
            const currentRecorder = mediaRecorder;
            currentRecorder.ondataavailable = event => {
                if (event.data && event.data.size) recordedChunks.push(event.data);
            };
            currentRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, {type:currentRecorder.mimeType || 'audio/mp4'});
                closeMediaStream();
                submitAppleRecording(blob);
            };
            currentRecorder.onerror = () => {
                closeMediaStream();
                resetRecognition('마이크를 다시 눌러 말해 보세요!');
            };
            currentRecorder.start();
            recognitionStarting = false;
            isListening = true;
            mic.classList.add('recording');
            hint.innerText = '말한 뒤 버튼을 다시 눌러주세요! 👂';
            recordingTimer = setTimeout(stopAppleRecording, 12000);
        } catch (error) {
            console.error('Apple 마이크 시작 실패:', error);
            closeMediaStream();
            resetRecognition('Safari의 마이크 사용을 허용해 주세요!');
        }
    };

    const handleMicPress = event => {
        if (event) event.preventDefault();
        unlockTtsAudio();
        // 챗봇이 말하는 동안에는 마이크가 절대 시작되지 않는다.
        if (isBotSpeaking || window.speechSynthesis.speaking) return;
        if (!mic.classList.contains('active')) return;
        if (isSubmittingSpeech) return;

        if (isAppleMobile) {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopAppleRecording();
            } else {
                startAppleRecording();
            }
            return;
        }

        if (isListening) {
            manualStopRequested = true;
            hint.innerText = '대답을 확인하고 있어요...';
            if (recognitionActive) {
                try { recognition.stop(); } catch(e) { submitRecognition(); }
            } else if (recognitionStarting) {
                // 태블릿에서 음성인식 준비가 늦을 때 두 번째 터치를 기억한다.
                hint.innerText = '마이크를 준비하고 있어요...';
            } else {
                submitRecognition();
            }
            return;
        }

        recognitionCandidates = [];
        manualStopRequested = false;
        isListening = true;
        recognitionStarting = true;
        try {
            recognition = createRecognition();
            recognition.start();
        } catch(e) {
            recognition = null;
            resetRecognition();
            return;
        }
        mic.classList.add('recording');
        hint.innerText = '말한 뒤 버튼을 다시 눌러주세요! 👂';
    };

    if (window.PointerEvent) {
        mic.addEventListener('pointerup', handleMicPress);
    } else {
        mic.addEventListener('click', handleMicPress);
    }

} else {
    mic.classList.remove('active');
    hint.innerText = '목소리가 안 들려요. 크롬 브라우저에서 마이크를 허용해 주세요!';
    alert('목소리가 안 들려요. 크롬 브라우저를 사용하고 마이크를 허용해 주세요!');
}
</script>
</body>
</html>
